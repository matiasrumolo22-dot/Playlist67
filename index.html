    <title>Videos Facheros</title>
    <style>
        /* Estas son propiedades externas para dar el "toque fachero" */
        iframe {
            border-radius: 30px; /* Hace los bordes redondos */
            transition: transform 0.3s; /* Prepara el movimiento suave */
            border: 5px solid #ff0051; /* Un borde de color llamativo */
        }

        /* Hace que el video se mueva un poco cuando pasas el mouse */
        iframe:hover {
            transform: scale(1.05) rotate(2deg); 
        }

        h2 {
            font-family: sans-serif;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
    </style>
</head>
